  <script src="../../Shared/js/bc-notify.js?v=20250659"></script><style id="bc-live-hero-theme">
  :root { --bc-hero-green: #12452d; --bc-hero-orange: #ff9f2e; }
  .homepage-header { background: linear-gradient(90deg, rgba(5,35,22,.48), rgba(12,55,33,.38)); border-bottom: 1px solid rgba(255,255,255,.18); box-shadow: 0 8px 28px rgba(0,0,0,calc(var(--header-scroll, 0) * .18)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .homepage-main, body.bc-file-banner-active .homepage-main { max-width: none; padding: 0 0 3rem; }
  .introduction-section { position: relative; isolation: isolate; overflow: hidden; display: grid; place-items: center; width: 100%; min-height: 100svh; margin: 0; padding: clamp(7rem, 12vh, 8rem) clamp(1.25rem, 5vw, 4rem) clamp(3rem, 7vh, 5rem); border-radius: 0; background: #103d28 url("../../Shared/images/tambo-barangay-hall-background.png") center center / cover no-repeat; text-align: center; }
  .introduction-section::before, .introduction-section::after { position: absolute; inset: 0; z-index: 0; content: ""; pointer-events: none; }
  .introduction-section::before { background: linear-gradient(105deg, rgba(4,37,23,.68), rgba(10,64,38,.58) 56%, rgba(12,61,38,.48)); }
  .introduction-section::after { background: linear-gradient(180deg, rgba(3,29,18,.02) 42%, rgba(3,29,18,.16)); }
  .intro-content { position: relative; z-index: 1; width: min(100%, 1200px); margin: auto; justify-self: center; align-self: center; text-align: center; }
  .intro-eyebrow { display: inline-flex; align-items: center; gap: .65rem; margin: 0 auto 1.6rem; padding: .6rem 1rem; border: 1px solid rgba(255,255,255,.24); border-radius: 999px; background: rgba(255,255,255,.1); color: #eff7ed; font-size: .82rem; font-weight: 700; letter-spacing: .06em; }
  .intro-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.2); animation: bc-live-dot-pulse 2.2s ease-in-out infinite; }
  @keyframes bc-live-dot-pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(74,222,128,.2); } 50% { box-shadow: 0 0 0 6px rgba(74,222,128,.08); } }
  .intro-title { max-width: 1200px; margin: 0 auto 1.2rem; color: #fff; font-size: clamp(3rem, 6vw, 6.2rem); white-space: nowrap; overflow-wrap: normal; word-break: normal; font-weight: 800; line-height: .98; letter-spacing: -.055em; text-shadow: 0 3px 24px rgba(0,0,0,.22); }
  .intro-title span { display: block; margin-top: .04em; background: none; color: var(--bc-hero-orange); -webkit-text-fill-color: var(--bc-hero-orange); }
  .intro-description { max-width: 780px; margin: 0 auto 1.65rem; padding: 0; color: rgba(255,255,255,.92); font-size: clamp(1rem, 1.5vw, 1.18rem); line-height: 1.7; }
  .intro-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: .8rem; margin: 0 auto 1.5rem; }
  .hero-cta { min-height: 50px; display: inline-flex; align-items: center; justify-content: center; gap: .65rem; padding: .75rem 1.4rem; border: 1px solid rgba(255,255,255,.56); border-radius: 999px; background: rgba(6,46,29,.28); color: #fff; font: 700 .96rem Poppins,sans-serif; text-decoration: none; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s; }
  .hero-cta--primary { border-color: var(--bc-hero-orange); background: var(--bc-hero-orange); color: #18251c; }
  .hero-cta:hover { transform: translateY(-2px); box-shadow: 0 9px 24px rgba(0,0,0,.2); }
