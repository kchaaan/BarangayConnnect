 <script>

    /* Role access is verified against the PHP Supabase session before portal initialization. */
    (async function verifySupabaseResidentSession() {
      const S=window.BarangayConnectSession;
      const front=S?S.frontPageUrl():'../../FrontPage/html/Front.html';
      document.documentElement.style.visibility='hidden';
      try {
        const response=await fetch('../../FrontPage/php/supabase_session.php',{credentials:'same-origin',cache:'no-store'});
        const session=response.ok?await response.json():null;
        if(!session||!session.authenticated||session.role!=='resident') throw new Error('Resident session required');
        const profile=session.resident||{};
        const user={id:session.id,residentId:session.residentId,firstname:profile.first_name||'Resident',firstName:profile.first_name||'Resident',lastName:profile.last_name||'',status:'ACTIVE'};
        window.currentResident=user;
        if(S) S.setResidentSession(user);
        localStorage.setItem('residentId',String(session.id));
        localStorage.setItem('residentCode',String(session.residentId||''));
        localStorage.setItem('residentFirstname',user.firstname);
        localStorage.setItem('residentLastname',user.lastName);
        const greeting=document.getElementById('user-greeting'); if(greeting) greeting.textContent=`Hello, ${user.firstname}!`;
        const idline=document.getElementById('user-id-line'); if(idline) idline.textContent=`ID: ${user.residentId||'—'}`;
        document.documentElement.style.visibility='visible';
      } catch(e) {
        if(S) S.clearResidentSession();
        ['residentId','residentCode','residentPortal','residentFirstname','residentLastname'].forEach(k=>localStorage.removeItem(k));
        window.location.replace(front);
      }
    })();

    /* ============================================================
       (UNCHANGED) — Sidebar navigation

    if (window.BarangayConnectNavPersist) {
      window.BarangayConnectNavPersist.initPortal({

          transparency: 'R_Transparency.html',

    }



    /* ============================================================
       (UNCHANGED) — Settings Menu + Logout
       ============================================================ */

    function toggleSettings() {
      const settingsMenu = document.getElementById('settingsMenu');
      settingsMenu.classList.toggle('show');
    }

    document.addEventListener('click', function(event) {
      const settingsDropdown = document.querySelector('.settings-dropdown');
      const settingsMenu = document.getElementById('settingsMenu');
      if (!settingsDropdown.contains(event.target)) settingsMenu.classList.remove('show');
    });

    function logout() {
      fetch('../../FrontPage/php/supabase_logout.php',{method:'POST',credentials:'same-origin'}).catch(function(){});
      if (window.BarangayConnectSession) {
        window.BarangayConnectSession.clearResidentSession();
        window.location.replace(window.BarangayConnectSession.frontPageUrl());
      } else {
        localStorage.removeItem("residentId");
        localStorage.removeItem("residentCode");
        localStorage.removeItem("residentPortal");
        localStorage.removeItem("residentFirstname");
        localStorage.removeItem("residentLastname");
        window.location.href = '../../FrontPage/html/Front.html';
      }
    }



    /* ============================================================
       ✨ CHANGED — Populate Update Profile from DATABASE not localStorage
       ============================================================ */

    function normalizeSelectValue(value) {
      return String(value || '').trim().toLowerCase();
    }

    function setSelectValue(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      const norm = normalizeSelectValue(value);
      let matched = false;
      Array.from(el.options).forEach(function (opt) {
        if (normalizeSelectValue(opt.value) === norm) {
          el.value = opt.value;
          matched = true;
        }
      });
      if (!matched && value) {
        el.value = value;
      }
    }

    function fillProfileForm(u) {
      if (!u) return;
      document.getElementById('firstName').value = u.firstName || u.firstname || '';
      document.getElementById('middleName').value = u.middleName || '';
      document.getElementById('lastName').value = u.lastName || u.lastname || '';
      document.getElementById('suffix').value = u.suffix || '';
      document.getElementById('email').value = u.email || '';
      document.getElementById('mobile').value = u.mobile || '';
      document.getElementById('dateOfBirth').value = u.dateOfBirth || '';
      document.getElementById('age').value =
        u.age != null && u.age !== '' && Number(u.age) > 0
          ? u.age
          : (computeAge(u.dateOfBirth) || '');
      setSelectValue('gender', u.gender || '');
      document.getElementById('placeOfBirth').value = u.placeOfBirth || '';
      setSelectValue('civilStatus', u.civilStatus || '');
      document.getElementById('citizenship').value = u.citizenship || '';
      document.getElementById('religion').value = u.religion || '';
      document.getElementById('street').value = u.street || u.houseStreet || '';
      document.getElementById('postalCode').value = u.postalCode || '';
      document.getElementById('emergencyName').value = u.emergencyName || '';
      document.getElementById('emergencyNumber').value = u.emergencyNumber || '';
      setSelectValue('emergencyRelationship', u.emergencyRelationship || '');
    }

    async function openUpdateProfile() {
      document.getElementById('settingsMenu').classList.remove('show');
      const modal = document.getElementById('updateProfileModal');
      if (!modal) return;

      modal.style.display = 'block';

      const S = window.BarangayConnectSession;
      const residentId = S ? S.getResidentId() : localStorage.getItem('residentId');
      const residentCode = localStorage.getItem('residentCode');
      const lookupId = residentId || residentCode;

      const ProfileApi = window.BarangayConnectResidentProfileApi;
      if (!ProfileApi) {
        alert('Profile service failed to load. Hard refresh the page (Ctrl+F5).');
        fillProfileForm(window.currentResident);
        return;
      }

      if (!lookupId) {
        alert('Session expired. Please log in again.');
        return;
      }

      const saveBtn = document.querySelector('#updateProfileForm .save-btn');
      const oldSaveLabel = saveBtn ? saveBtn.innerHTML : '';
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
      }

      try {
        const profile = await ProfileApi.fetchProfile(lookupId);
        window.currentResident = profile;
        fillProfileForm(profile);
      } catch (err) {
        console.error('Profile fetch:', err);
        alert('Could not load your profile from the database. ' + (err.message || ''));
        fillProfileForm(window.currentResident);
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = oldSaveLabel || '<i class="fas fa-save"></i> Save Changes';
        }
      }
    }

    function closeUpdateProfile() {
      document.getElementById('updateProfileModal').style.display = 'none';
    }



    /* ============================================================
       ✨ CHANGED — UPDATE PROFILE VIA DATABASE
       ============================================================ */

    document.getElementById('updateProfileForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const requiredFields = ['firstName', 'lastName', 'email', 'mobile', 'dateOfBirth', 'gender', 'placeOfBirth', 'civilStatus', 'citizenship', 'religion', 'street', 'postalCode', 'emergencyName', 'emergencyNumber', 'emergencyRelationship'];
        let isValid = true;
        requiredFields.forEach(field => {
            const input = document.getElementById(field);
            if (!input.value.trim()) {
                input.style.borderColor = '#e74c3c';
                isValid = false;
            } else {
                input.style.borderColor = '#e0e0e0';
            }
        });
        if (!isValid) {
            alert('Please fill in all required fields.');
            return;
        }

        const S = window.BarangayConnectSession;
        const residentId = S ? S.getResidentId() : localStorage.getItem('residentId');
        const residentCode = localStorage.getItem('residentCode');
        const lookupId = residentId || residentCode;

        if (!lookupId) {
            alert('Session expired. Please log in again.');
            return;
        }

        const updatedData = {
            firstName: document.getElementById('firstName').value.trim(),
            middleName: document.getElementById('middleName').value.trim(),
            lastName: document.getElementById('lastName').value.trim(),
            suffix: document.getElementById('suffix').value,
            email: document.getElementById('email').value.trim(),
            mobile: document.getElementById('mobile').value.trim(),
            dateOfBirth: document.getElementById('dateOfBirth').value,
            age: document.getElementById('age').value ? Number(document.getElementById('age').value) : null,
            gender: document.getElementById('gender').value,
            placeOfBirth: document.getElementById('placeOfBirth').value.trim(),
            civilStatus: document.getElementById('civilStatus').value,
            citizenship: document.getElementById('citizenship').value.trim(),
            religion: document.getElementById('religion').value.trim(),
            street: document.getElementById('street').value.trim(),
            barangay: document.getElementById('barangay').value.trim(),
            city: document.getElementById('city').value.trim(),
            province: document.getElementById('province').value.trim(),
            postalCode: document.getElementById('postalCode').value.trim(),
            emergencyName: document.getElementById('emergencyName').value.trim(),
            emergencyNumber: document.getElementById('emergencyNumber').value.trim(),
            emergencyRelationship: document.getElementById('emergencyRelationship').value
        };

        const ProfileApi = window.BarangayConnectResidentProfileApi;
        if (!ProfileApi) {
            alert('Profile service is unavailable.');
            return;
        }

        const saveBtn = this.querySelector('.save-btn');
        if (saveBtn) saveBtn.disabled = true;

        try {
            const result = await ProfileApi.updateProfile(lookupId, updatedData);
            const profile = result.profile || await ProfileApi.fetchProfile(lookupId);
            window.currentResident = profile;

            if (window.BarangayConnectSession) {
                window.BarangayConnectSession.setResidentSession({
                    id: profile.id,
                    residentId: profile.residentId,
                    firstname: profile.firstName || profile.firstname,
                    lastname: profile.lastName || profile.lastname,
                    status: profile.status || 'ACTIVE',
                });
            } else {
                localStorage.setItem('residentFirstname', profile.firstName || '');
                localStorage.setItem('residentLastname', profile.lastName || '');
            }

            document.getElementById('user-greeting').textContent =
                `Hello, ${profile.firstName || profile.firstname || 'Resident'}!`;

            alert('Profile updated successfully!');
            closeUpdateProfile();
        } catch (err) {
            console.error('Update error:', err);
            alert(err.message || 'Error updating profile. Please try again.');
        } finally {
            if (saveBtn) saveBtn.disabled = false;
        }
    });

    function computeAge(dateString) {
      if (!dateString) return "";
      const dob = new Date(dateString);
      if (Number.isNaN(dob.getTime())) return "";
      const today = new Date();
      let ageValue = today.getFullYear() - dob.getFullYear();
      const monthDiff = today.getMonth() - dob.getMonth();
      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
        ageValue -= 1;
      }
      return ageValue >= 0 ? ageValue : "";
    }

    (function setupAgeAutoCompute() {
      const dobInput = document.getElementById('dateOfBirth');
      const ageInput = document.getElementById('age');
      if (!dobInput || !ageInput) return;

      dobInput.addEventListener('change', function() {
        ageInput.value = computeAge(this.value);
      });
    })();



    /* ============================================================
       (UNCHANGED) Sidebar Toggle, Layout, Heartbeat, Modal Close
       ============================================================ */

    function toggleSidebar() {
      if (window.BarangayConnectSidebarGsap) {
        window.BarangayConnectSidebarGsap.toggle();
        return;
      }
      document.querySelector('.modern-sidebar').classList.toggle('collapsed');
    }

    window.addEventListener('message', function (event) {
      if (event.data && event.data.type === 'bc-borrow-changed') {
        document.querySelectorAll('iframe').forEach(function (iframe) {
          try {
            if (iframe.contentWindow) iframe.contentWindow.postMessage(event.data, '*');
          } catch (err) { /* ignore */ }
        });
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      if (window.BarangayConnectSidebarGsap) {
        window.BarangayConnectSidebarGsap.init();
      }

      const hamburgerIcon = document.querySelector('.sidebar-toprow i.fa-bars');
      if (hamburgerIcon) {
        hamburgerIcon.addEventListener('click', toggleSidebar);
        hamburgerIcon.style.cursor = 'pointer';
      }
    });

    function setHeaderOffset() {
      var header = document.querySelector('.admin-header');
      if (!header) return;
      var borderBottom = 3;
      var offset = header.offsetHeight + borderBottom;
      document.documentElement.style.setProperty('--header-offset', offset + 'px');
    }

    function setCurrentDate() {
      var dateElement = document.getElementById('current-date');
      if (!dateElement) return;
      var today = new Date();
      var datePart = today.toLocaleDateString('en-US', {
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      });
      var weekday = today.toLocaleDateString('en-US', { weekday: 'long' });
      dateElement.textContent = datePart + ' | ' + weekday;
    }

    window.addEventListener('load', function() {
      setHeaderOffset();
      setCurrentDate();
    });

    window.addEventListener('resize', setHeaderOffset);

    (function() {
      const modal = document.getElementById('updateProfileModal');
      const box = modal ? modal.querySelector('.modal-content') : null;
      if (!modal) return;
      let overlayMouseDown = false;
      modal.addEventListener('mousedown', e => overlayMouseDown = (e.target === modal));
      modal.addEventListener('mouseup', e => {
        if (overlayMouseDown && e.target === modal) closeUpdateProfile();
        overlayMouseDown = false;
      });
      if (box) ['mousedown','mouseup','click'].forEach(evt => box.addEventListener(evt,e=>e.stopPropagation()));
      const closer = document.querySelector('[data-close="updateProfileModal"]');
      if (closer) closer.addEventListener('click', closeUpdateProfile);
    })();

</script>
