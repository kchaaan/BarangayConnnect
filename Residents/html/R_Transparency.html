<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transparency - BarangayConnect</title>
  <link rel="stylesheet" href="../css/R_transparency-style.css?v=20261015-seal-layout-pdf-report">
  <style>
    html.dashboard-embed .transparency-wrapper{min-height:0;padding:.35rem;background:#f6f8f6}html.dashboard-embed .transparency-card{padding:0}html.dashboard-embed .transparency-card>h2{display:none}html.dashboard-embed .budget-section{padding:.7rem .9rem;border-radius:12px;box-shadow:0 2px 7px rgba(0,0,0,.06)}html.dashboard-embed .budget-section h3{font-size:1.3rem;margin:.15rem 0}.dashboard-embed .budget-title,.dashboard-embed .spent-line{font-size:.78rem}.dashboard-embed .progress-bar{height:7px;margin:.2rem 0}.dashboard-embed .management-section{margin-top:.65rem;padding:.8rem;border-radius:12px}.dashboard-embed .management-header{margin-bottom:.65rem;padding-bottom:.55rem}.dashboard-embed .management-header h2{font-size:1.1rem}.dashboard-embed .management-controls{display:none}.dashboard-embed .items-container{grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}.dashboard-embed .item-card{padding:.75rem;border-width:1px;border-radius:10px}.dashboard-embed .item-header{margin-bottom:.55rem;gap:.4rem}.dashboard-embed .item-title h4{font-size:.84rem}.dashboard-embed .item-body{font-size:.78rem}.dashboard-embed .item-metrics{gap:.35rem}.dashboard-embed .metric label{font-size:.62rem}.dashboard-embed .metric .value{font-size:.75rem}.dashboard-embed .progress-track{height:6px;margin:.45rem 0}.dashboard-embed .item-description,.dashboard-embed .item-actions{display:none}.dashboard-embed .dashboard-more-count{margin:.45rem 0 0;color:#5f6d5b;font-size:.75rem}@media(max-width:640px){.dashboard-embed .items-container{grid-template-columns:1fr}}
    * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
    *::-webkit-scrollbar { display: none !important; }
  </style>
  <link rel="stylesheet" href="../css/bc-resident-page-title.css?v=20250620">
  <script src="https://kit.fontawesome.com/a2e0f1f0c1.js" crossorigin="anonymous"></script>
  <script src="../../Shared/js/bc-transparency-api.js?v=20250663"></script>
  <script src="../../Shared/js/bc-transparency-print.js?v=20261015-seal-layout"></script>
  <script>if(new URLSearchParams(location.search).get('embed')==='dashboard')document.documentElement.classList.add('dashboard-embed');</script>
</head>
<body>

<main class="transparency-wrapper">
  <div class="transparency-card">

    <h2>Transparency</h2>

    <div class="budget-section">
      <div class="budget-head">
        <p class="budget-title">Annual Budget</p>
      </div>

      <h3 id="annualBudget">₱ 0</h3>

      <div class="progress-bar">
        <div class="progress-fill" id="budgetProgress" style="width: 0%"></div>
      </div>

      <p class="spent-line">
        Spent: <span id="spentAmount">₱ 0</span>
        <span id="remainingFunds">Remaining Funds: ₱ 0</span>
      </p>
    </div>

    <section class="management-section">
      <div class="management-header">
        <h2><i class="fas fa-briefcase"></i> Projects & Programs</h2>

        <div class="management-controls">
          <div class="filter-group">
            <select id="statusFilter" class="filter-select">
              <option value="all">All Status</option>
              <option value="Ongoing">Ongoing</option>
              <option value="Completed">Completed</option>
              <option value="Pending">Pending</option>
            </select>

            <select id="typeFilter" class="filter-select">
              <option value="all">All Types</option>
              <option value="Project">Projects</option>
              <option value="Program">Programs</option>
            </select>
          </div>
        </div>
      </div>

      <div class="items-container" id="itemsContainer"></div>
    </section>

  </div>
</main>
<script>
(function () {
  const TransparencyApi = window.BarangayConnectTransparencyApi;
  const peso = n => "₱ " + Number(n || 0).toLocaleString("en-PH");

  let items = [];
  let currentBudget = 0;

  function fileUrl(relativePath) {
    if (!relativePath || !TransparencyApi) return "#";
    return new URL(relativePath, TransparencyApi.uploadBase()).href;
  }

  function updateBudget() {
    const totalSpent = items.reduce((sum, item) => sum + (Number(item.spent) || 0), 0);
    const remaining = currentBudget - totalSpent;
    const percent = currentBudget > 0 ? Math.min(100, Math.round((totalSpent / currentBudget) * 100)) : 0;

    document.getElementById("annualBudget").textContent = peso(currentBudget);
    document.getElementById("spentAmount").textContent = peso(totalSpent);
    document.getElementById("remainingFunds").textContent = "Remaining Funds: " + peso(remaining);
    document.getElementById("budgetProgress").style.width = percent + "%";
  }

  function renderItems() {
    const statusFilter = document.getElementById("statusFilter").value;
    const typeFilter = document.getElementById("typeFilter").value;
    const container = document.getElementById("itemsContainer");

    const filtered = items.filter(item =>
      (statusFilter === "all" || item.status === statusFilter) &&
      (typeFilter === "all" || item.type === typeFilter)
    );
    const dashboardEmbed = new URLSearchParams(window.location.search).get("embed") === "dashboard";
    const visibleItems = dashboardEmbed ? filtered.slice(0, 3) : filtered;

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-inbox"></i>
          <p>No projects or programs yet</p>
        </div>`;
      return;
    }

    container.innerHTML = visibleItems.map(item => {
      const budget = Number(item.budget) || 0;
      const spent = Number(item.spent) || 0;
      const percent = budget > 0 ? Math.min(100, Math.round((spent / budget) * 100)) : 0;

      let documentButtons = "";
      if (item.documents && item.documents.length > 0) {
        documentButtons = item.documents.map(doc => `
          <a href="${escapeHtml(fileUrl(doc.filePath))}"
             target="_blank"
             rel="noopener"
             class="action-icon view"
             title="Open supporting PDF" aria-label="Open supporting PDF">
             <i class="fas fa-file-pdf"></i>
          </a>
        `).join("");
      } else {
        documentButtons = `<span class="no-files">No documents</span>`;
      }

      const reportButton = `<button type="button" class="action-icon pdf-export" data-id="${escapeHtml(item.id)}" title="Print or save project report as PDF" aria-label="Print or save ${escapeHtml(item.name)} report as PDF"><i class="fas fa-file-pdf"></i></button>`;

      const description = item.description
        ? `<p class="item-description">${escapeHtml(item.description)}</p>`
        : "";

      return `
        <div class="item-card">
          <div class="item-header">
            <div class="item-title">
              <h4>${escapeHtml(item.name)}</h4>
              <span class="item-type-badge">${escapeHtml(item.type)}</span>
            </div>
            <span class="status-badge ${String(item.status || "").toLowerCase()}">${escapeHtml(item.status)}</span>
          </div>

          <div class="item-body">
            <div class="item-metrics">
              <div class="metric">
                <label>Budget</label>
                <span class="value">${peso(budget)}</span>
              </div>
              <div class="metric">
                <label>Spent</label>
                <span class="value">${peso(spent)}</span>
              </div>
              <div class="metric">
                <label>Progress</label>
                <span class="value">${percent}%</span>
              </div>
            </div>

            <div class="progress-track">
              <div class="progress-bar-item" style="width:${percent}%"></div>
            </div>

            ${description}
          </div>

          <div class="item-actions">
            ${reportButton}
            ${documentButtons}
          </div>
        </div>
      `;
    }).join("") + (dashboardEmbed && filtered.length > visibleItems.length
      ? `<p class="dashboard-more-count">Showing ${visibleItems.length} of ${filtered.length} records. View all records for the complete list.</p>`
      : "");
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function loadBudget() {
    if (!TransparencyApi) return;
    try {
      const res = await fetch(TransparencyApi.apiUrl("budget"));
      if (res.status === 204) {
        currentBudget = 0;
      } else if (res.ok) {
        const data = await res.json();
        currentBudget = Number(data.amount || 0);
      }
      updateBudget();
    } catch (err) {
      console.error("Error loading budget:", err);
    }
  }

  async function loadItems() {
    if (!TransparencyApi) return;
    try {
      const res = await fetch(TransparencyApi.apiUrl("items"));
      if (!res.ok) throw new Error("HTTP " + res.status);
      items = await res.json();
      updateBudget();
      renderItems();
    } catch (err) {
      console.error("Error fetching transparency items:", err);
      document.getElementById("itemsContainer").innerHTML = `
        <div class="empty-state">
          <i class="fas fa-triangle-exclamation"></i>
          <p>Could not load transparency data</p>
        </div>`;
    }
  }

  async function init() {
    if (!TransparencyApi) return;
    await loadBudget();
    await loadItems();
  }

  document.getElementById("statusFilter").addEventListener("change", renderItems);
  document.getElementById("typeFilter").addEventListener("change", renderItems);
  document.getElementById("itemsContainer").addEventListener("click", event => {
    const button = event.target.closest(".pdf-export");
    if (!button) return;
    const item = items.find(row => String(row.id) === button.dataset.id);
    if (window.BCTransparencyPrint) window.BCTransparencyPrint.printItem(item);
    else window.alert("The PDF report tool did not load. Please reopen this page.");
  });

  init();
})();
</script>
</body>
</html>
